name: Lean Action CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # This development produces roughly 10 GB of temporary .lake artifacts.
      # These directories are preinstalled tools on the disposable GitHub runner,
      # not project files or GitHub cache contents.
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          df -h
      - name: Test proof-policy rejection behavior
        run: python3 -B scripts/test_proof_policy.py
      - name: Enforce no-placeholder source policy
        run: python3 scripts/check_proof_policy.py --source-only
      - uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9 # v1.5.0
        with:
          build: true
          use-mathlib-cache: true
      - name: Enforce explicit theorem axiom allowlist
        run: python3 scripts/check_proof_policy.py
