name: Run Comparator

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  comparator:
    name: Check headline statements with Comparator
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false
      - uses: ./.github/actions/setup-lean
      - name: Get Mathlib build cache
        run: lake exe cache get
      - name: Build completed formalization
        run: lake build
      - name: Build Comparator statement modules
        run: lake build Challenge Solution
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.24.0"
          cache: false
      - name: Install Rust 1.82.0 for NanoDa
        run: |
          rustup toolchain install 1.82.0 --profile minimal --no-self-update
          rustup run 1.82.0 rustc --version --verbose
          rustup run 1.82.0 cargo --version
      - name: Run pinned Comparator toolchain
        env:
          COMPARATOR_CACHE: ${{ runner.temp }}/quadratic-carleson-comparator
        run: |
          set -euo pipefail

          repository_root="$GITHUB_WORKSPACE"
          cache_root="$COMPARATOR_CACHE"
          bin_dir="$cache_root/bin"
          comparator_dir="$cache_root/comparator"
          lean4export_dir="$cache_root/lean4export"
          nanoda_dir="$cache_root/nanoda"

          comparator_commit=19e111e2141cf333c7daff0f64c5f24acc91dd2e
          lean4export_commit=cacf989bd75f608700820f6afc595f32e7a99a4d
          landrun_commit=811cfff51ceaf3d9843708aa6d22e9b84ccac8b4
          nanoda_commit=68d5ca9db226849b41a6fff59d796ff19d0a8840

          checkout_exact() {
            local repository=$1
            local destination=$2
            local commit=$3

            git clone --filter=blob:none "$repository" "$destination"
            git -C "$destination" fetch --depth 1 origin "$commit"
            git -C "$destination" checkout --detach "$commit"
          }

          mkdir -p "$bin_dir"
          checkout_exact https://github.com/leanprover/comparator.git "$comparator_dir" "$comparator_commit"
          checkout_exact https://github.com/leanprover/lean4export.git "$lean4export_dir" "$lean4export_commit"
          checkout_exact https://github.com/robsimmons/nanoda_lib.git "$nanoda_dir" "$nanoda_commit"

          project_toolchain=$(tr -d '[:space:]' < "$repository_root/lean-toolchain")
          lean4export_toolchain=$(tr -d '[:space:]' < "$lean4export_dir/lean-toolchain")
          if [ "$project_toolchain" != "$lean4export_toolchain" ]; then
            echo "error: project and lean4export toolchains do not match" >&2
            exit 1
          fi

          GOBIN="$bin_dir" CGO_ENABLED=0 go install "github.com/zouuup/landrun/cmd/landrun@$landrun_commit"
          (cd "$comparator_dir" && lake build comparator)
          (cd "$lean4export_dir" && ELAN_TOOLCHAIN="$project_toolchain" lake build lean4export)
          (cd "$nanoda_dir" && cargo +1.82.0 build --release --locked)

          export COMPARATOR_LANDRUN="$bin_dir/landrun"
          export COMPARATOR_LEAN4EXPORT="$lean4export_dir/.lake/build/bin/lean4export"
          export COMPARATOR_NANODA="$nanoda_dir/target/release/nanoda_bin"

          cd "$repository_root"
          lake env "$comparator_dir/.lake/build/bin/comparator" comparator.json
